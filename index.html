<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F1E7">
  <title>Temu Misdinar Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <main id="view" aria-live="polite"></main>

  <nav class="nav" aria-label="Navigasi utama">
    <button data-page="home"><i data-lucide="house"></i><span>Home</span></button>
    <button data-page="finance"><i data-lucide="wallet"></i><span>Finance</span></button>
    <button class="fab" id="fab" aria-label="Tambah transaksi"><i data-lucide="plus"></i></button>
    <button data-page="activity"><i data-lucide="calendar-days"></i><span>Activity</span></button>
    <button data-page="iuran"><i data-lucide="users"></i><span>Iuran</span></button>
  </nav>
</div>

<!-- Modal Sheet: Tambah Transaksi -->
<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="txForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div class="grab"></div>
    <h2 id="sheetTitle">Tambah transaksi</h2>
    <div class="seg" role="radiogroup" aria-label="Jenis transaksi">
      <label><input type="radio" name="type" value="income" checked><span>Pemasukan</span></label>
      <label><input type="radio" name="type" value="expense"><span>Pengeluaran</span></label>
    </div>
    <label class="field">Nominal
      <div class="money"><b>Rp</b><input name="amount" id="amount" inputmode="numeric" placeholder="0" autocomplete="off"></div>
    </label>
    <label class="field">Kategori <select name="category" id="category"></select></label>
    <div class="row2">
      <label class="field">Tanggal <input type="date" name="date" id="date"></label>
      <label class="field">Activity <select name="activityId" id="activitySel"></select></label>
    </div>
    <label class="field">Catatan <input name="note" placeholder="Contoh: Penjualan makanan"></label>
    <p class="err" id="formErr" hidden></p>
    <button class="btn" type="submit">Simpan transaksi</button>
  </form>
</div>

<!-- Modal Sheet: Catat Pembayaran Iuran -->
<div class="overlay" id="payOverlay" hidden>
  <form class="sheet" id="payForm" role="dialog" aria-modal="true" aria-labelledby="payTitle" novalidate>
    <div class="grab"></div>
    <h2 id="payTitle">Catat pembayaran</h2>
    <label class="field">Nama Anggota <select id="payMember"></select></label>
    <label class="field">Tanggal Pembayaran <input type="date" id="payDate"></label>
    <div class="field">Nominal
      <div class="quick" id="quick"></div>
      <div class="money"><b>Rp</b><input id="payAmount" inputmode="numeric" placeholder="0" autocomplete="off"></div>
    </div>
    <div class="payinfo" id="payInfo"></div>
    <p class="err" id="payErr" hidden></p>
    <button class="btn" type="submit">Simpan pembayaran</button>
  </form>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ==================== 1. DATA & API LAYER ==================== */
const API_URL = "https://script.google.com/macros/s/AKfycbx5OkclwJGukN3D3ff9AtlAHEtCZqN9PN9qliqQeKsEOiX5OiXPBI8MyiL9vCAQf0-h/exec";

const DB = (() => {
  const first = ["Fridolin","Andreas","Maria","Yohanes","Kevin","Agnes","Benedikta","Cornelius","Dominikus","Elisabeth","Felix","Gabriel","Helena","Ignatius","Josephine","Katarina","Laurentius","Margaretha","Nikolaus","Oktavia"];
  const last = ["", "Wijaya", "Santoso"];
  const unpaid = [3,4,9,14,19,23,28,33,38,44,50,55];
  const lv = ["Senior","Senior","Intermediate","Junior"];
  const lvCycle = ["Junior","Intermediate","Senior"];
  const members = [], payments = [];
  let n = 0;
  for (let i = 0; i < 60; i++) {
    const id = "M" + String(i + 1).padStart(3, "0");
    members.push({
      id, joinWeek: 1,
      name: i === 0 ? "Fridolin Austin" : (first[i % 20] + " " + last[Math.floor(i / 20)]).trim(),
      level: i < 4 ? lv[i] : lvCycle[i % 3]
    });
    if (!unpaid.includes(i)) {
      const w = [4,6,8,2,5,4,7,3][n % 8] + (n >= 1 && n <= 6 ? 1 : 0);
      payments.push({ id: "P" + (n + 1), memberId: id, date: n % 2 ? "2026-09-29" : "2026-09-28", amount: w * 5000 });
      n++;
    }
  }

  const activities = [
    { id: "a1", name: "Bazaar 2026", date: "2026-09-28", type: "event" },
    { id: "a2", name: "Iuran Misdinar", date: "2026-09-25", type: "iuran" },
    { id: "a3", name: "Merchandise Temu Misdinar", date: "2026-09-20", type: "event" },
    { id: "a4", name: "Donasi Paroki", date: "2026-09-15", type: "event" },
    { id: "a5", name: "Persiapan Temu Misdinar", date: "2026-09-10", type: "event" }
  ];
  const T = (id, type, amount, category, date, activityId, note) => ({ id, type, amount, category, date, activityId, note });
  const transactions = [
    T("t1", "income", 2500000, "Penjualan", "2026-09-28", "a1", "Penjualan makanan"),
    T("t2", "income", 1250000, "Penjualan", "2026-09-28", "a1", "Penjualan minuman"),
    T("t3", "income", 500000, "Donasi", "2026-09-28", "a1", "Donasi pengunjung"),
    T("t4", "expense", 800000, "Bahan", "2026-09-27", "a1", "Bahan makanan"),
    T("t5", "expense", 250000, "Dekorasi", "2026-09-26", "a1", "Dekorasi"),
    T("t6", "expense", 150000, "Perlengkapan", "2026-09-26", "a1", "Perlengkapan"),
    T("t7", "income", payments.reduce((s, p) => s + p.amount, 0), "Iuran", "2026-09-28", "a2", "Iuran mingguan anggota"),
    T("t8", "income", 2500000, "Penjualan", "2026-09-20", "a3", "Penjualan kaos dan pin"),
    T("t9", "expense", 1300000, "Bahan", "2026-09-18", "a3", "Produksi merchandise"),
    T("t10", "income", 5000000, "Donasi", "2026-09-15", "a4", "Donasi paroki"),
    T("t11", "income", 2250000, "Donasi", "2026-09-14", "a4", "Donasi umat"),
    T("t12", "expense", 250000, "Konsumsi", "2026-09-10", "a5", "Konsumsi rapat panitia")
  ];
  return { activities, transactions, members, payments };
})();

const TARGET_DANA = 250000000;

const Api = {
  delay: (ms = 400) => new Promise(r => setTimeout(r, ms)),

  async load() { await this.delay(); return structuredClone(DB); },
  async getMembers() { await this.delay(200); return structuredClone(DB.members); },
  
  async recordPayment({ memberId, paymentDate, amount }) {
    if (typeof google !== "undefined" && google.script && google.script.run) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err => reject(new Error(err.message)))
          .recordPaymentApi({ member_id: memberId, payment_date: paymentDate, amount: amount });
      });
    }

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "record_payment", member_id: memberId, payment_date: paymentDate, amount })
      });
      const data = await res.json();
      if (data.status !== "success") throw new Error(data.message || "Gagal menyimpan.");
      return data;
    } catch (e) {
      throw new Error("Koneksi gagal atau terblokir: " + e.message);
    }
  },

  async mockApplyPayment(memberId, isoDate, amount) {
    DB.payments.push({ id: "P" + Date.now(), memberId, date: isoDate, amount });
    const iuranTx = DB.transactions.find(t => t.id === "t7");
    if (iuranTx) iuranTx.amount += amount;
  }
};

/* ==================== 2. INITIALIZATION ==================== */
document.addEventListener('DOMContentLoaded', () => {
  if (window.lucide) lucide.createIcons();
});
</script>
</body>
</html>
